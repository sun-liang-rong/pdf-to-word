<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b0ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00b0ff;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="100" y1="0" x2="1200" y2="530"/>
    <line x1="200" y1="0" x2="1200" y2="430"/>
    <line x1="300" y1="0" x2="1200" y2="330"/>
    <line x1="400" y1="0" x2="1200" y2="230"/>
    <line x1="500" y1="0" x2="1200" y2="130"/>
    <line x1="600" y1="0" x2="1200" y2="30"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <line x1="1100" y1="0" x2="0" y2="530"/>
    <line x1="1000" y1="0" x2="0" y2="430"/>
    <line x1="900" y1="0" x2="0" y2="330"/>
    <line x1="800" y1="0" x2="0" y2="230"/>
    <line x1="700" y1="0" x2="0" y2="130"/>
  </g>
  
  <!-- Decorative network nodes and connections -->
  <g stroke="rgba(0,230,118,0.15)" stroke-width="1.5" fill="none">
    <!-- Top network cluster -->
    <circle cx="120" cy="80" r="40" stroke="rgba(0,176,255,0.1)"/>
    <circle cx="120" cy="80" r="25" stroke="rgba(0,230,118,0.12)"/>
    <circle cx="280" cy="60" r="30"/>
    <circle cx="420" cy="100" r="35"/>
    <circle cx="580" cy="70" r="28"/>
    <circle cx="740" cy="90" r="32"/>
    <circle cx="920" cy="65" r="38"/>
    <circle cx="1080" cy="85" r="26"/>
    
    <!-- Connection lines -->
    <line x1="160" y1="80" x2="250" y2="60"/>
    <line x1="310" y1="60" x2="385" y2="100"/>
    <line x1="455" y1="100" x2="552" y2="70"/>
    <line x1="608" y1="70" x2="708" y2="90"/>
    <line x1="772" y1="90" x2="882" y2="65"/>
    <line x1="958" y1="65" x2="1054" y2="85"/>
    
    <!-- Bottom network cluster -->
    <circle cx="80" cy="520" r="28"/>
    <circle cx="200" cy="560" r="35"/>
    <circle cx="340" cy="530" r="30"/>
    <circle cx="500" cy="570" r="25"/>
    <circle cx="660" cy="540" r="33"/>
    <circle cx="820" cy="565" r="27"/>
    <circle cx="980" cy="535" r="36"/>
    <circle cx="1120" cy="555" r="29"/>
    
    <!-- Bottom connections -->
    <line x1="108" y1="520" x2="165" y2="560"/>
    <line x1="235" y1="560" x2="310" y2="530"/>
    <line x1="370" y1="530" x2="475" y2="570"/>
    <line x1="525" y1="570" x2="627" y2="540"/>
    <line x1="693" y1="540" x2="793" y2="565"/>
    <line x1="847" y1="565" x2="944" y2="535"/>
    <line x1="1016" y1="535" x2="1091" y2="555"/>
    
    <!-- Cross connections -->
    <line x1="120" y1="120" x2="200" y2="525"/>
    <line x1="580" y1="98" x2="500" y2="545"/>
    <line x1="920" y1="103" x2="980" y2="500"/>
  </g>
  
  <!-- Floating data nodes (glowing) -->
  <g filter="url(#glow)">
    <circle cx="180" cy="200" r="5" fill="rgba(0,230,118,0.6)"/>
    <circle cx="350" cy="180" r="4" fill="rgba(0,176,255,0.5)"/>
    <circle cx="520" cy="220" r="6" fill="rgba(0,230,118,0.4)"/>
    <circle cx="680" cy="190" r="4" fill="rgba(0,176,255,0.6)"/>
    <circle cx="850" cy="210" r="5" fill="rgba(0,230,118,0.5)"/>
    <circle cx="1020" cy="195" r="4" fill="rgba(0,176,255,0.4)"/>
    
    <circle cx="150" cy="440" r="4" fill="rgba(0,176,255,0.5)"/>
    <circle cx="320" cy="460" r="5" fill="rgba(0,230,118,0.4)"/>
    <circle cx="480" cy="430" r="4" fill="rgba(0,176,255,0.6)"/>
    <circle cx="650" cy="450" r="6" fill="rgba(0,230,118,0.5)"/>
    <circle cx="810" cy="435" r="4" fill="rgba(0,176,255,0.4)"/>
    <circle cx="980" cy="455" r="5" fill="rgba(0,230,118,0.6)"/>
  </g>
  
  <!-- Central decorative element - hexagonal pattern -->
  <g stroke="rgba(0,230,118,0.08)" stroke-width="1" fill="none">
    <polygon points="600,180 660,210 660,270 600,300 540,270 540,210"/>
    <polygon points="600,160 680,200 680,280 600,320 520,280 520,200"/>
    <polygon points="600,140 700,190 700,290 600,340 500,290 500,190"/>
  </g>
  
  <!-- Decorative bracket/JSON icon left -->
  <g transform="translate(100, 280)" stroke="rgba(0,230,118,0.2)" stroke-width="2" fill="none">
    <path d="M20,0 L10,0 L10,20 L0,20 L0,40 L10,40 L10,60 L20,60"/>
    <path d="M30,0 L40,0 L40,20 L50,20 L50,40 L40,40 L40,60 L30,60"/>
  </g>
  
  <!-- Decorative bracket/JSON icon right -->
  <g transform="translate(1050, 280)" stroke="rgba(0,176,255,0.2)" stroke-width="2" fill="none">
    <path d="M20,0 L10,0 L10,20 L0,20 L0,40 L10,40 L10,60 L20,60"/>
    <path d="M30,0 L40,0 L40,20 L50,20 L50,40 L40,40 L40,60 L30,60"/>
  </g>
  
  <!-- Decorative code/document icon -->
  <g transform="translate(540, 360)" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <rect x="0" y="0" width="120" height="80" rx="5"/>
    <line x1="15" y1="20" x2="105" y2="20"/>
    <line x1="15" y1="35" x2="80" y2="35"/>
    <line x1="15" y1="50" x2="95" y2="50"/>
    <line x1="15" y1="65" x2="60" y2="65"/>
  </g>
  
  <!-- Title text -->
  <text x="600" y="260" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="52" font-weight="bold" fill="white" filter="url(#softGlow)">
    结构化输出与Function Calling
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="48" font-weight="bold" fill="url(#accentGrad)" filter="url(#softGlow)">
    大模型如何革新PDF智能处理
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="395" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="22" fill="rgba(255,255,255,0.6)">
    Structured Output · Function Calling · Document Intelligence
  </text>
  
  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="rgba(0,0,0,0.3)"/>
  
  <!-- Date and tags -->
  <text x="40" y="610" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="16" fill="rgba(255,255,255,0.7)">
    2026-06-01
  </text>
  
  <!-- Tags -->
  <g transform="translate(200, 595)">
    <rect x="0" y="0" width="90" height="26" rx="13" fill="rgba(0,230,118,0.2)" stroke="rgba(0,230,118,0.4)" stroke-width="1"/>
    <text x="45" y="17" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12" fill="rgba(0,230,118,0.9)">LLM</text>
  </g>
  <g transform="translate(300, 595)">
    <rect x="0" y="0" width="110" height="26" rx="13" fill="rgba(0,176,255,0.2)" stroke="rgba(0,176,255,0.4)" stroke-width="1"/>
    <text x="55" y="17" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12" fill="rgba(0,176,255,0.9)">Function Calling</text>
  </g>
  <g transform="translate(420, 595)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="rgba(0,230,118,0.2)" stroke="rgba(0,230,118,0.4)" stroke-width="1"/>
    <text x="50" y="17" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12" fill="rgba(0,230,118,0.9)">PDF解析</text>
  </g>
  <g transform="translate(530, 595)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="rgba(0,176,255,0.2)" stroke="rgba(0,176,255,0.4)" stroke-width="1"/>
    <text x="50" y="17" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12" fill="rgba(0,176,255,0.9)">文档智能</text>
  </g>
  <g transform="translate(640, 595)">
    <rect x="0" y="0" width="90" height="26" rx="13" fill="rgba(0,230,118,0.2)" stroke="rgba(0,230,118,0.4)" stroke-width="1"/>
    <text x="45" y="17" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12" fill="rgba(0,230,118,0.9)">GPT-5</text>
  </g>
  
  <!-- Author -->
  <text x="1160" y="610" text-anchor="end" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">
    Al磊 · AI技术博客
  </text>
</svg>