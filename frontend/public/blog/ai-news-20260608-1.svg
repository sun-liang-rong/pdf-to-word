<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#6366f1" stroke-width="0.5" fill="none">
    <line x1="0" y1="0" x2="0" y2="630" /><line x1="60" y1="0" x2="60" y2="630" />
    <line x1="120" y1="0" x2="120" y2="630" /><line x1="180" y1="0" x2="180" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" /><line x1="300" y1="0" x2="300" y2="630" />
    <line x1="360" y1="0" x2="360" y2="630" /><line x1="420" y1="0" x2="420" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" /><line x1="540" y1="0" x2="540" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" /><line x1="660" y1="0" x2="660" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" /><line x1="780" y1="0" x2="780" y2="630" />
    <line x1="840" y1="0" x2="840" y2="630" /><line x1="900" y1="0" x2="900" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" /><line x1="1020" y1="0" x2="1020" y2="630" />
    <line x1="1080" y1="0" x2="1080" y2="630" /><line x1="1140" y1="0" x2="1140" y2="630" />
    <line x1="0" y1="0" x2="1200" y2="0" /><line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" /><line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" /><line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" /><line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="480" x2="1200" y2="480" /><line x1="0" y1="540" x2="1200" y2="540" />
  </g>
  
  <!-- Decorative network nodes - left cluster -->
  <g filter="url(#softglow)" opacity="0.4">
    <circle cx="120" cy="180" r="4" fill="#6366f1"/>
    <circle cx="200" cy="120" r="3" fill="#8b5cf6"/>
    <circle cx="160" cy="260" r="5" fill="#6366f1"/>
    <circle cx="80" cy="320" r="3" fill="#a78bfa"/>
    <circle cx="180" cy="400" r="4" fill="#8b5cf6"/>
    <circle cx="60" cy="450" r="2" fill="#6366f1"/>
    <line x1="120" y1="180" x2="200" y2="120" stroke="#6366f1" stroke-width="0.8" opacity="0.5"/>
    <line x1="120" y1="180" x2="160" y2="260" stroke="#6366f1" stroke-width="0.8" opacity="0.5"/>
    <line x1="160" y1="260" x2="80" y2="320" stroke="#8b5cf6" stroke-width="0.6" opacity="0.4"/>
    <line x1="160" y1="260" x2="180" y2="400" stroke="#6366f1" stroke-width="0.6" opacity="0.4"/>
    <line x1="80" y1="320" x2="60" y2="450" stroke="#8b5cf6" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- Decorative network nodes - right cluster -->
  <g filter="url(#softglow)" opacity="0.4">
    <circle cx="1050" cy="150" r="4" fill="#8b5cf6"/>
    <circle cx="1120" cy="220" r="3" fill="#6366f1"/>
    <circle cx="1080" cy="300" r="5" fill="#a78bfa"/>
    <circle cx="1140" cy="380" r="3" fill="#8b5cf6"/>
    <circle cx="1060" cy="450" r="4" fill="#6366f1"/>
    <circle cx="1100" cy="520" r="2" fill="#a78bfa"/>
    <line x1="1050" y1="150" x2="1120" y2="220" stroke="#8b5cf6" stroke-width="0.8" opacity="0.5"/>
    <line x1="1120" y1="220" x2="1080" y2="300" stroke="#6366f1" stroke-width="0.8" opacity="0.5"/>
    <line x1="1080" y1="300" x2="1140" y2="380" stroke="#a78bfa" stroke-width="0.6" opacity="0.4"/>
    <line x1="1080" y1="300" x2="1060" y2="450" stroke="#8b5cf6" stroke-width="0.6" opacity="0.4"/>
    <line x1="1060" y1="450" x2="1100" y2="520" stroke="#6366f1" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- Floating geometric shapes -->
  <g opacity="0.15">
    <rect x="900" y="80" width="40" height="40" rx="4" fill="none" stroke="#6366f1" stroke-width="1" transform="rotate(15,920,100)"/>
    <polygon points="100,500 120,470 140,500" fill="none" stroke="#8b5cf6" stroke-width="1"/>
    <circle cx="1100" cy="550" r="20" fill="none" stroke="#6366f1" stroke-width="1"/>
    <rect x="150" y="100" width="25" height="25" fill="none" stroke="#a78bfa" stroke-width="0.8" transform="rotate(45,162,112)"/>
  </g>
  
  <!-- Code bracket decorations -->
  <g opacity="0.12" stroke="#6366f1" stroke-width="2" fill="none">
    <path d="M100,315 L80,315 L80,285 L60,285"/>
    <path d="M1100,315 L1120,315 L1120,285 L1140,285"/>
    <text x="55" y="310" font-family="monospace" font-size="14" fill="#6366f1" opacity="0.3">&lt;/&gt;</text>
    <text x="1145" y="310" font-family="monospace" font-size="14" fill="#6366f1" opacity="0.3">{}</text>
  </g>
  
  <!-- Decorative line at top -->
  <rect x="200" y="60" width="800" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>
  
  <!-- Main title -->
  <text x="600" y="240" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="bold" fill="white" filter="url(#glow)">Search as Code</text>
  <text x="600" y="300" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="36" fill="white" opacity="0.95">AI模型自主编写搜索管线的技术革命</text>
  
  <!-- Accent line below title -->
  <rect x="400" y="330" width="400" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>
  
  <!-- Subtitle -->
  <text x="600" y="380" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#a78bfa" opacity="0.8">Perplexity SaC · Agent自主搜索 · Token成本降低85%</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="560" width="1200" height="70" fill="#0a0e27" opacity="0.7"/>
  <line x1="0" y1="560" x2="1200" y2="560" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  
  <!-- Date and tags -->
  <text x="60" y="598" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8b8fa3">2026-06-08</text>
  
  <g transform="translate(200, 582)">
    <rect x="0" y="0" width="90" height="26" rx="13" fill="#6366f1" opacity="0.2" stroke="#6366f1" stroke-width="0.5" opacity="0.4"/>
    <text x="45" y="17" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#a78bfa">Perplexity</text>
  </g>
  <g transform="translate(300, 582)">
    <rect x="0" y="0" width="80" height="26" rx="13" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="0.5" opacity="0.4"/>
    <text x="40" y="17" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#c4b5fd">Agent AI</text>
  </g>
  <g transform="translate(390, 582)">
    <rect x="0" y="0" width="80" height="26" rx="13" fill="#6366f1" opacity="0.2" stroke="#6366f1" stroke-width="0.5" opacity="0.4"/>
    <text x="40" y="17" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#a78bfa">搜索引擎</text>
  </g>
  <g transform="translate(480, 582)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="0.5" opacity="0.4"/>
    <text x="50" y="17" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#c4b5fd">AI Agent架构</text>
  </g>
  
  <!-- Author -->
  <text x="1140" y="598" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6366f1" opacity="0.7">Al磊</text>
</svg>