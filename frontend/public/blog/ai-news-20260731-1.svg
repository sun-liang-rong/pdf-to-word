<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="45%" stop-color="#102a5c"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title{font-family:Arial,'Noto Sans SC','Microsoft YaHei',sans-serif;font-weight:800;fill:#ffffff;font-size:56px;letter-spacing:-1px}
      .sub{font-family:Arial,'Noto Sans SC','Microsoft YaHei',sans-serif;font-weight:600;fill:#c7d2fe;font-size:24px}
      .tag{font-family:Arial,'Noto Sans SC','Microsoft YaHei',sans-serif;font-weight:700;fill:#e0f2fe;font-size:22px}
      .small{font-family:Arial,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#93c5fd;font-size:18px}
      .line{stroke:#67e8f9;stroke-width:2;opacity:.38}
      .node{fill:#e0f2fe;opacity:.9}
      .grid{stroke:#ffffff;stroke-width:1;opacity:.06}
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <g opacity="0.85">
    <path class="grid" d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path class="grid" d="M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630"/>
  </g>

  <g transform="translate(70 70)">
    <line class="line" x1="20" y1="90" x2="150" y2="30"/>
    <line class="line" x1="150" y1="30" x2="260" y2="120"/>
    <line class="line" x1="260" y1="120" x2="385" y2="60"/>
    <line class="line" x1="75" y1="205" x2="260" y2="120"/>
    <line class="line" x1="75" y1="205" x2="205" y2="285"/>
    <circle class="node" cx="20" cy="90" r="7"/>
    <circle class="node" cx="150" cy="30" r="9"/>
    <circle class="node" cx="260" cy="120" r="8"/>
    <circle class="node" cx="385" cy="60" r="6"/>
    <circle class="node" cx="75" cy="205" r="8"/>
    <circle class="node" cx="205" cy="285" r="6"/>
  </g>

  <g transform="translate(810 110)" opacity="0.78">
    <polygon points="90,0 180,52 180,156 90,208 0,156 0,52" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <polygon points="90,48 138,76 138,132 90,160 42,132 42,76" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.85"/>
    <circle cx="90" cy="104" r="20" fill="#22d3ee" opacity="0.22"/>
    <path d="M90 48V0M138 76l42-24M138 132l42 24M90 160v48M42 132L0 156M42 76L0 52" stroke="#c4b5fd" stroke-width="2" opacity="0.6"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="96" y="185" width="1008" height="265" rx="30" fill="#020617" opacity="0.52" stroke="#60a5fa" stroke-opacity="0.25"/>
    <text x="600" y="282" text-anchor="middle" class="title">Agentic RAG文档智能体</text>
    <text x="600" y="355" text-anchor="middle" class="title">让PDF转换可验证、可修复</text>
    <text x="600" y="405" text-anchor="middle" class="sub">Retrieval-Augmented Generation · Tool Use · Quality Evaluation</text>
  </g>

