    <text x="28" y="37" class="small">2026-07-31</text>
    <text x="215" y="38" class="tag">#Agentic RAG</text>
    <text x="405" y="38" class="tag">#文档智能</text>
    <text x="575" y="38" class="tag">#OCR</text>
    <text x="690" y="38" class="tag">#质量评估</text>
  </g>

  <g opacity="0.22">
    <circle cx="1050" cy="500" r="90" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="1050" cy="500" r="55" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <path d="M990 500h120M1050 440v120" stroke="#e0f2fe" stroke-width="2"/>
  </g>
</svg>
