<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  
  <!-- Network nodes -->
  <g fill="#8b5cf6" filter="url(#glow)">
    <circle cx="150" cy="120" r="6"/>
    <circle cx="300" cy="80" r="5"/>
    <circle cx="450" cy="150" r="7"/>
    <circle cx="600" cy="100" r="6"/>
    <circle cx="750" cy="130" r="5"/>
    <circle cx="900" cy="90" r="6"/>
    <circle cx="1050" cy="140" r="5"/>
    <circle cx="120" cy="300" r="5"/>
    <circle cx="280" cy="350" r="6"/>
    <circle cx="440" cy="280" r="5"/>
    <circle cx="600" cy="320" r="7"/>
    <circle cx="760" cy="290" r="6"/>
    <circle cx="920" cy="340" r="5"/>
    <circle cx="1080" cy="310" r="6"/>
  </g>
  
  <!-- Connecting lines -->
  <g stroke="#8b5cf6" stroke-width="1" opacity="0.6">
    <line x1="150" y1="120" x2="300" y2="80"/>
    <line x1="300" y1="80" x2="450" y2="150"/>
    <line x1="450" y1="150" x2="600" y2="100"/>
    <line x1="600" y1="100" x2="750" y2="130"/>
    <line x1="750" y1="130" x2="900" y2="90"/>
    <line x1="900" y1="90" x2="1050" y2="140"/>
    <line x1="120" y1="300" x2="280" y2="350"/>
    <line x1="280" y1="350" x2="440" y2="280"/>
    <line x1="440" y1="280" x2="600" y2="320"/>
    <line x1="600" y1="320" x2="760" y2="290"/>
    <line x1="760" y1="290" x2="920" y2="340"/>
    <line x1="920" y1="340" x2="1080" y2="310"/>
    <line x1="450" y1="150" x2="440" y2="280"/>
    <line x1="600" y1="100" x2="600" y2="320"/>
    <line x1="750" y1="130" x2="760" y2="290"/>
  </g>
  
  <!-- Geometric shapes -->
  <g fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.4">
    <polygon points="200,400 250,350 300,400 250,450"/>
    <rect x="900" y="400" width="80" height="80" transform="rotate(45 940 440)"/>
    <circle cx="150" cy="500" r="30"/>
    <path d="M 1000 480 Q 1050 520 1100 480" stroke-width="3"/>
  </g>
  
  <!-- Data flow particles -->
  <g fill="#22d3ee">
    <circle cx="200" cy="200" r="2" opacity="0.8">
      <animate attributeName="cx" values="200;1000;200" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;400;200" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="150" r="2" opacity="0.6">
      <animate attributeName="cx" values="800;400;800" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;350;150" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Main title -->
  <text x="600" y="280" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="52" font-weight="bold" fill="#ffffff" filter="url(#glow)">
    多模态大模型突破：
  </text>
  <text x="600" y="340" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="48" font-weight="bold" fill="#ffffff" filter="url(#glow)">
    PDF文档理解进入视觉智能时代
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="420" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="28" fill="#94a3b8">
    视觉语言模型(VLM)如何革新文档处理工作流
  </text>
  
  <!-- Date and tags -->
  <g font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="20">
    <text x="100" y="590" fill="#64748b">2026年5月29日</text>
    <text x="300" y="590" fill="#8b5cf6">#多模态AI</text>
    <text x="420" y="590" fill="#8b5cf6">#视觉语言模型</text>
    <text x="580" y="590" fill="#8b5cf6">#文档智能</text>
    <text x="720" y="590" fill="#8b5cf6">#PDF处理</text>
    <text x="860" y="590" fill="#8b5cf6">#AI工作流</text>
  </g>
  
  <!-- Bottom decorative bar -->
  <rect x="100" y="600" width="1000" height="4" rx="2" fill="url(#bgGrad)" opacity="0.8"/>
  <rect x="100" y="600" width="200" height="4" rx="2" fill="#8b5cf6"/>
</svg>