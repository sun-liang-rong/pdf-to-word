<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a2a" />
      <stop offset="50%" stop-color="#1a1a4a" />
      <stop offset="100%" stop-color="#2a1a5a" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#7b2ff7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg-gradient)" />
  
  <!-- 科技装饰：网络节点 -->
  <g fill="#00d4ff" opacity="0.3">
    <circle cx="100" cy="100" r="3" />
    <circle cx="300" cy="150" r="4" />
    <circle cx="500" cy="80" r="2" />
    <circle cx="700" cy="200" r="5" />
    <circle cx="900" cy="120" r="3" />
    <circle cx="1100" cy="180" r="4" />
    <circle cx="150" cy="300" r="3" />
    <circle cx="350" cy="350" r="2" />
    <circle cx="550" cy="250" r="4" />
    <circle cx="750" cy="400" r="3" />
    <circle cx="950" cy="320" r="5" />
    <circle cx="1050" cy="450" r="2" />
    <circle cx="200" cy="500" r="3" />
    <circle cx="400" cy="550" r="4" />
    <circle cx="600" cy="480" r="2" />
    <circle cx="800" cy="550" r="3" />
    <circle cx="1000" cy="500" r="4" />
    <circle cx="1150" cy="550" r="3" />
  </g>
  
  <!-- 连接线 -->
  <g stroke="#00d4ff" stroke-width="1" opacity="0.2">
    <line x1="100" y1="100" x2="300" y2="150" />
    <line x1="300" y1="150" x2="500" y2="80" />
    <line x1="500" y1="80" x2="700" y2="200" />
    <line x1="700" y1="200" x2="900" y2="120" />
    <line x1="900" y1="120" x2="1100" y2="180" />
    <line x1="150" y1="300" x2="350" y2="350" />
    <line x1="350" y1="350" x2="550" y2="250" />
    <line x1="550" y1="250" x2="750" y2="400" />
    <line x1="750" y1="400" x2="950" y2="320" />
    <line x1="950" y1="320" x2="1050" y2="450" />
    <line x1="200" y1="500" x2="400" y2="550" />
    <line x1="400" y1="550" x2="600" y2="480" />
    <line x1="600" y1="480" x2="800" y2="550" />
    <line x1="800" y1="550" x2="1000" y2="500" />
    <line x1="1000" y1="500" x2="1150" y2="550" />
    <!-- 跨区域连接 -->
    <line x1="300" y1="150" x2="350" y2="350" />
    <line x1="700" y1="200" x2="750" y2="400" />
    <line x1="900" y1="120" x2="950" y2="320" />
    <line x1="550" y1="250" x2="600" y2="480" />
  </g>
  
  <!-- 几何装饰 -->
  <g fill="none" stroke="#7b2ff7" stroke-width="2" opacity="0.2">
    <rect x="80" y="400" width="80" height="80" rx="10" transform="rotate(45 120 440)" />
    <polygon points="1050,50 1090,130 1010,130" />
    <circle cx="900" cy="500" r="40" />
    <rect x="150" y="150" width="60" height="60" rx="5" transform="rotate(30 180 180)" />
  </g>
  
  <!-- 标题文字 -->
  <g filter="url(#glow)">
    <text x="600" y="280" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">
      自主进化AI代理
    </text>
    <text x="600" y="340" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">
      MUSE-Autoskill框架深度解析
    </text>
  </g>
  
  <!-- 副标题 -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="20" fill="#cccccc" text-anchor="middle">
    让AI通过技能创造、记忆、管理与评估实现自我进化
  </text>
  
  <!-- 底部信息 -->
  <rect x="0" y="580" width="1200" height="50" fill="#000000" opacity="0.3" />
  <text x="100" y="610" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">
    2026年5月27日
  </text>
  <text x="400" y="610" font-family="Arial, sans-serif" font-size="16" fill="#00d4ff">
    AI代理 · 自主进化 · 技能管理 · MUSE-Autoskill
  </text>
  <text x="1100" y="610" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="end">
    技术博客
  </text>
</svg>