<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <!-- 科技装饰元素 - 网络节点 -->
  <g opacity="0.3">
    <!-- 左侧节点网络 -->
    <circle cx="150" cy="120" r="4" fill="#06b6d4"/>
    <circle cx="250" cy="180" r="3" fill="#8b5cf6"/>
    <circle cx="100" cy="250" r="5" fill="#06b6d4"/>
    <circle cx="200" cy="320" r="3" fill="#8b5cf6"/>
    <circle cx="80" cy="400" r="4" fill="#06b6d4"/>
    
    <!-- 连线 -->
    <line x1="150" y1="120" x2="250" y2="180" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <line x1="250" y1="180" x2="100" y2="250" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="250" x2="200" y2="320" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <line x1="200" y1="320" x2="80" y2="400" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
    
    <!-- 右侧节点网络 -->
    <circle cx="1050" cy="100" r="4" fill="#8b5cf6"/>
    <circle cx="1100" cy="200" r="3" fill="#06b6d4"/>
    <circle cx="1020" cy="280" r="5" fill="#8b5cf6"/>
    <circle cx="1120" cy="350" r="3" fill="#06b6d4"/>
    <circle cx="1080" cy="450" r="4" fill="#8b5cf6"/>
    
    <!-- 连线 -->
    <line x1="1050" y1="100" x2="1100" y2="200" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
    <line x1="1100" y1="200" x2="1020" y2="280" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <line x1="1020" y1="280" x2="1120" y2="350" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
    <line x1="1120" y1="350" x2="1080" y2="450" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- 几何图形装饰 -->
  <g opacity="0.2">
    <polygon points="100,500 150,450 200,500 175,550 125,550" fill="none" stroke="#06b6d4" stroke-width="1"/>
    <polygon points="1050,80 1100,30 1150,80 1125,130 1075,130" fill="none" stroke="#8b5cf6" stroke-width="1"/>
    <rect x="50" y="480" width="60" height="60" fill="none" stroke="#06b6d4" stroke-width="1" transform="rotate(45 80 510)"/>
    <rect x="1090" y="40" width="60" height="60" fill="none" stroke="#8b5cf6" stroke-width="1" transform="rotate(45 1120 70)"/>
  </g>
  
  <!-- 中央标题区域 -->
  <g filter="url(#glow)">
    <!-- 主标题 -->
    <text x="600" y="250" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white" text-anchor="middle">
      思维链推理技术新突破
    </text>
    
    <!-- 副标题 -->
    <text x="600" y="320" font-family="Arial, sans-serif" font-size="36" fill="url(#accentGradient)" text-anchor="middle">
      让AI像人类一样深度思考
    </text>
    
    <!-- 技术标签 -->
    <text x="600" y="380" font-family="Arial, sans-serif" font-size="24" fill="#a5b4fc" text-anchor="middle">
      Chain-of-Thought · Reasoning · AI Agent · 大语言模型
    </text>
  </g>
  
  <!-- 分割线 -->
  <line x1="200" y1="420" x2="1000" y2="420" stroke="url(#accentGradient)" stroke-width="2" opacity="0.5"/>
  
  <!-- 底部信息 -->
  <g>
    <!-- 日期 -->
    <text x="600" y="480" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">
      2026年5月27日
    </text>
    
    <!-- 作者 -->
    <text x="600" y="520" font-family="Arial, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">
      by Al磊 · AI技术博客
    </text>
    
    <!-- 装饰点 -->
    <circle cx="560" cy="520" r="4" fill="#06b6d4"/>
    <circle cx="640" cy="520" r="4" fill="#8b5cf6"/>
  </g>
  
  <!-- 角落装饰 -->
  <g opacity="0.4">
    <path d="M 0 0 L 100 0 L 100 10 L 10 10 L 10 100 L 0 100 Z" fill="#06b6d4"/>
    <path d="M 1200 630 L 1100 630 L 1100 620 L 1190 620 L 1190 530 L 1200 530 Z" fill="#8b5cf6"/>
  </g>
  
  <!-- 浮动粒子效果 -->
  <g opacity="0.6">
    <circle cx="300" cy="150" r="2" fill="#06b6d4">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="200" r="2" fill="#8b5cf6">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="480" r="2" fill="#06b6d4">
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="500" r="2" fill="#8b5cf6">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>