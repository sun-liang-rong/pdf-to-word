<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- 深色渐变背景 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </linearGradient>
    
    <!-- 科技蓝渐变 -->
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- 紫色点缀 -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b2cbf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9d4edd;stop-opacity:1" />
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 节点发光 -->
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- 装饰网格线 -->
  <g stroke="rgba(0, 212, 255, 0.08)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>
  
  <!-- 左侧神经网络节点 -->
  <g id="leftNetwork">
    <!-- 连线 -->
    <g stroke="rgba(0, 212, 255, 0.25)" stroke-width="1.5">
      <line x1="100" y1="150" x2="180" y2="200"/>
      <line x1="100" y1="150" x2="200" y2="280"/>
      <line x1="180" y1="200" x2="280" y2="250"/>
      <line x1="200" y1="280" x2="280" y2="320"/>
      <line x1="280" y1="250" x2="320" y2="350"/>
      <line x1="280" y1="320" x2="320" y2="350"/>
      <line x1="320" y1="350" x2="380" y2="400"/>
      <line x1="100" y1="300" x2="180" y2="350"/>
      <line x1="180" y1="350" x2="280" y2="400"/>
      <line x1="280" y1="400" x2="380" y2="450"/>
    </g>
    <!-- 节点 -->
    <circle cx="100" cy="150" r="8" fill="url(#techGradient)" filter="url(#nodeGlow)"/>
    <circle cx="180" cy="200" r="6" fill="url(#purpleGradient)" filter="url(#nodeGlow)"/>
    <circle cx="200" cy="280" r="7" fill="url(#techGradient)" filter="url(#nodeGlow)"/>
    <circle cx="280" cy="250" r="5" fill="url(#purpleGradient)" filter="url(#nodeGlow)"/>
    <circle cx="280" cy="320" r="6" fill="url(#techGradient)" filter="url(#nodeGlow)"/>
    <circle cx="320" cy="350" r="8" fill="url(#purpleGradient)" filter="url(#nodeGlow)"/>
    <circle cx="380" cy="400" r="5" fill="url(#techGradient)" filter="url(#nodeGlow)"/>
    <circle cx="100" cy="300" r="6" fill="url(#purpleGradient)" filter="url(#nodeGlow)"/>
    <circle cx="180" cy="350" r="7" fill="url(#techGradient)" filter="url(#nodeGlow)"/>
    <circle cx="280" cy="400" r="5" fill="url(#purpleGradient)" filter="url(#nodeGlow)"/>
    <circle cx="380" cy="450" r="6" fill="url(#techGradient)" filter="url(#nodeGlow)"/>
  </g>
  
  <!-- 右侧神经网络节点 -->
  <g id="rightNetwork">
    <!-- 连线 -->
    <g stroke="rgba(0, 212, 255, 0.25)" stroke-width="1.5">
      <line x1="1100" y1="150" x2="1020" y2="200"/>
      <line x1="1100" y1="150" x2="1000" y2="280"/>
      <line x1="1020" y1="200" x2="920" y2="250"/>
      <line x1="1000" y1="280" x2="920" y2="320"/>
      <line x1="920" y1="250" x2="880" y2="350"/>
      <line x1="920" y1="320" x2="880" y2="350"/>
      <line x1="880" y1="350" x2="820" y2="400"/>
      <line x1="1100" y1="300" x2="1020" y2="350"/>
      <line x1="1020" y1="350" x2="920" y2="400"/>
      <line x1="920" y1="400" x2="820" y2="450"/>
    </g>
    <!-- 节点 -->
    <circle cx="1100" cy="150" r="8" fill="url(#purpleGradient)" filter="url(#nodeGlow)"/>
    <circle cx="1020" cy="200" r="6" fill="url(#techGradient)" filter="url(#nodeGlow)"/>
    <circle cx="1000" cy="280" r="7" fill="url(#purpleGradient)" filter="url(#nodeGlow)"/>
    <circle cx="920" cy="250" r="5" fill="url(#techGradient)" filter="url(#nodeGlow)"/>
    <circle cx="920" cy="320" r="6" fill="url(#purpleGradient)" filter="url(#nodeGlow)"/>
    <circle cx="880" cy="350" r="8" fill="url(#techGradient)" filter="url(#nodeGlow)"/>
    <circle cx="820" cy="400" r="5" fill="url(#purpleGradient)" filter="url(#nodeGlow)"/>
    <circle cx="1100" cy="300" r="6" fill="url(#techGradient)" filter="url(#nodeGlow)"/>
    <circle cx="1020" cy="350" r="7" fill="url(#purpleGradient)" filter="url(#nodeGlow)"/>
    <circle cx="920" cy="400" r="5" fill="url(#techGradient)" filter="url(#nodeGlow)"/>
    <circle cx="820" cy="450" r="6" fill="url(#purpleGradient)" filter="url(#nodeGlow)"/>
  </g>
  
  <!-- 中央装饰图形 - 多边形 -->
  <g id="centerDecorations" transform="translate(600, 315)">
    <!-- 外层六边形 -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" 
             fill="none" stroke="url(#techGradient)" stroke-width="2" filter="url(#glow)" opacity="0.6"/>
    <!-- 内层六边形 -->
    <polygon points="0,-80 70,-40 70,40 0,80 -70,40 -70,-40" 
             fill="none" stroke="url(#purpleGradient)" stroke-width="1.5" opacity="0.8"/>
    <!-- 中心圆 -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#techGradient)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="20" fill="rgba(0, 212, 255, 0.15)"/>
    <!-- 连接线 -->
    <g stroke="rgba(0, 212, 255, 0.4)" stroke-width="1">
      <line x1="0" y1="-120" x2="0" y2="-35"/>
      <line x1="104" y1="-60" x2="70" y2="-40"/>
      <line x1="104" y1="60" x2="70" y2="40"/>
      <line x1="0" y1="120" x2="0" y2="35"/>
      <line x1="-104" y1="60" x2="-70" y2="40"/>
      <line x1="-104" y1="-60" x2="-70" y2="-40"/>
    </g>
  </g>
  
  <!-- 漂浮的几何图形 -->
  <g opacity="0.15">
    <polygon points="150,500 180,520 150,540 120,520" fill="url(#techGradient)"/>
    <polygon points="1050,500 1080,520 1050,540 1020,520" fill="url(#purpleGradient)"/>
    <circle cx="200" cy="550" r="15" fill="none" stroke="url(#techGradient)" stroke-width="2"/>
    <circle cx="1000" cy="550" r="15" fill="none" stroke="url(#purpleGradient)" stroke-width="2"/>
  </g>
  
  <!-- 标题文字 -->
  <text x="600" y="280" 
        font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" 
        font-size="42" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle"
        filter="url(#glow)">
    多模态大模型推理能力突破
  </text>
  
  <!-- 副标题 -->
  <text x="600" y="330" 
        font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" 
        font-size="22" 
        fill="rgba(255, 255, 255, 0.8)" 
        text-anchor="middle">
    深度解析视觉-语言模型的思维链推理革命
  </text>
  
  <!-- 底部信息栏 -->
  <rect x="0" y="560" width="1200" height="70" fill="rgba(10, 10, 26, 0.85)" opacity="0.9"/>
  
  <!-- 日期 -->
  <text x="60" y="595" 
        font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" 
        font-size="16" 
        fill="rgba(0, 212, 255, 0.9)"
        font-weight="bold">
    2026.05.23
  </text>
  
  <!-- 标签 -->
  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" fill="#ffffff">
    <rect x="200" y="578" width="90" height="28" rx="14" fill="rgba(0, 212, 255, 0.2)" stroke="url(#techGradient)" stroke-width="1"/>
    <text x="245" y="597" text-anchor="middle">多模态</text>
    
    <rect x="310" y="578" width="100" height="28" rx="14" fill="rgba(123, 44, 191, 0.2)" stroke="url(#purpleGradient)" stroke-width="1"/>
    <text x="360" y="597" text-anchor="middle">推理能力</text>
    
    <rect x="430" y="578" width="100" height="28" rx="14" fill="rgba(0, 153, 255, 0.2)" stroke="url(#techGradient)" stroke-width="1"/>
    <text x="480" y="597" text-anchor="middle">思维链</text>
    
    <rect x="550" y="578" width="100" height="28" rx="14" fill="rgba(157, 78, 221, 0.2)" stroke="url(#purpleGradient)" stroke-width="1"/>
    <text x="600" y="597" text-anchor="middle">AI大模型</text>
  </g>
  
  <!-- 装饰点 -->
  <g fill="url(#techGradient)" filter="url(#nodeGlow)">
    <circle cx="50" cy="80" r="3"/>
    <circle cx="1150" cy="80" r="3"/>
    <circle cx="50" cy="500" r="3"/>
    <circle cx="1150" cy="500" r="3"/>
  </g>
</svg>