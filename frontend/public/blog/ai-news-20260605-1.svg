<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a192f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b4d8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nvidiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76b900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid lines -->
  <g opacity="0.05" stroke="#00d4aa" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left side: robot arm / circuit pattern -->
  <g filter="url(#softGlow)" opacity="0.25">
    <circle cx="90" cy="130" r="4" fill="#76b900"/>
    <circle cx="160" cy="90" r="3" fill="#00d4aa"/>
    <circle cx="130" cy="200" r="5" fill="#00b4d8"/>
    <circle cx="70" cy="270" r="3" fill="#76b900"/>
    <circle cx="190" cy="210" r="4" fill="#00d4aa"/>
    <circle cx="110" cy="320" r="3" fill="#00b4d8"/>
    <circle cx="50" cy="180" r="2" fill="#76b900"/>
    <circle cx="200" cy="160" r="3" fill="#00d4aa"/>
    <circle cx="140" cy="370" r="4" fill="#76b900"/>
    <line x1="90" y1="130" x2="160" y2="90" stroke="#00d4aa" stroke-width="1" opacity="0.5"/>
    <line x1="90" y1="130" x2="130" y2="200" stroke="#76b900" stroke-width="1" opacity="0.5"/>
    <line x1="160" y1="90" x2="200" y2="160" stroke="#00b4d8" stroke-width="1" opacity="0.4"/>
    <line x1="130" y1="200" x2="190" y2="210" stroke="#00d4aa" stroke-width="1" opacity="0.5"/>
    <line x1="130" y1="200" x2="70" y2="270" stroke="#76b900" stroke-width="1" opacity="0.4"/>
    <line x1="70" y1="270" x2="110" y2="320" stroke="#00d4aa" stroke-width="1" opacity="0.4"/>
    <line x1="190" y1="210" x2="110" y2="320" stroke="#00b4d8" stroke-width="1" opacity="0.3"/>
    <line x1="110" y1="320" x2="140" y2="370" stroke="#76b900" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Right side: neural network pattern -->
  <g filter="url(#softGlow)" opacity="0.25">
    <circle cx="1060" cy="110" r="4" fill="#76b900"/>
    <circle cx="1130" cy="160" r="3" fill="#00d4aa"/>
    <circle cx="1090" cy="220" r="5" fill="#00b4d8"/>
    <circle cx="1160" cy="270" r="3" fill="#76b900"/>
    <circle cx="1030" cy="300" r="4" fill="#00d4aa"/>
    <circle cx="1110" cy="340" r="3" fill="#00b4d8"/>
    <circle cx="1190" cy="190" r="2" fill="#76b900"/>
    <line x1="1060" y1="110" x2="1130" y2="160" stroke="#00d4aa" stroke-width="1" opacity="0.5"/>
    <line x1="1060" y1="110" x2="1090" y2="220" stroke="#76b900" stroke-width="1" opacity="0.5"/>
    <line x1="1130" y1="160" x2="1190" y2="190" stroke="#00b4d8" stroke-width="1" opacity="0.4"/>
    <line x1="1090" y1="220" x2="1160" y2="270" stroke="#00d4aa" stroke-width="1" opacity="0.5"/>
    <line x1="1160" y1="270" x2="1110" y2="340" stroke="#76b900" stroke-width="1" opacity="0.4"/>
    <line x1="1030" y1="300" x2="1110" y2="340" stroke="#00d4aa" stroke-width="1" opacity="0.4"/>
    <line x1="1090" y1="220" x2="1030" y2="300" stroke="#00b4d8" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Floating geometric shapes -->
  <g opacity="0.12">
    <polygon points="960,480 980,465 1000,480 1000,505 980,520 960,505" fill="none" stroke="#00d4aa" stroke-width="1.5"/>
    <polygon points="110,460 140,500 80,500" fill="none" stroke="#76b900" stroke-width="1.5"/>
    <polygon points="1120,480 1140,500 1120,520 1100,500" fill="none" stroke="#00b4d8" stroke-width="1"/>
    <circle cx="200" cy="510" r="18" fill="none" stroke="#00d4aa" stroke-width="1"/>
    <rect x="920" y="140" width="12" height="12" fill="none" stroke="#76b900" stroke-width="1" transform="rotate(45 926 146)"/>
    <rect x="310" y="110" width="10" height="10" fill="none" stroke="#00d4aa" stroke-width="1" transform="rotate(30 315 115)"/>
  </g>

  <!-- Robot icon silhouette (simplified) -->
  <g transform="translate(1050, 420)" opacity="0.15">
    <rect x="0" y="0" width="30" height="25" rx="4" fill="none" stroke="#00d4aa" stroke-width="2"/>
    <circle cx="10" cy="12" r="3" fill="#00d4aa"/>
    <circle cx="22" cy="12" r="3" fill="#00d4aa"/>
    <line x1="10" y1="25" x2="5" y2="40" stroke="#00d4aa" stroke-width="2"/>
    <line x1="20" y1="25" x2="25" y2="40" stroke="#00d4aa" stroke-width="2"/>
  </g>

  <!-- Center accent line -->
  <rect x="300" y="225" width="600" height="3" rx="1.5" fill="url(#accentGrad)" opacity="0.8"/>

  <!-- Main title line 1 -->
  <text x="600" y="280" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="bold" fill="white" filter="url(#glow)">
    NVIDIA CVPR 2026
  </text>
  <!-- Main title line 2 -->
  <text x="600" y="335" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="bold" fill="white" filter="url(#glow)">
    Physical AI Agent Skills 全面发布
  </text>

  <!-- Subtitle -->
  <text x="600" y="380" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#7ee8c6" opacity="0.9">
    机器人自主抓取 · 自动驾驶智能训练 · 物理世界Agent开发新范式
  </text>

  <!-- Bottom bar -->
  <rect x="0" y="560" width="1200" height="70" fill="#0b1628" opacity="0.6"/>

  <!-- Date -->
  <text x="60" y="598" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#00d4aa">
    2026年6月5日
  </text>
  <text x="60" y="618" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6b7280">
    by Al磊
  </text>

  <!-- Tags -->
  <g transform="translate(300, 590)">
    <rect x="0" y="0" width="95" height="26" rx="13" fill="#76b900" opacity="0.2" stroke="#76b900" stroke-width="1"/>
    <text x="47" y="17" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#b8e060">NVIDIA</text>

    <rect x="105" y="0" width="110" height="26" rx="13" fill="#00d4aa" opacity="0.2" stroke="#00d4aa" stroke-width="1"/>
    <text x="160" y="17" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#7ee8c6">CVPR 2026</text>

    <rect x="225" y="0" width="120" height="26" rx="13" fill="#00b4d8" opacity="0.2" stroke="#00b4d8" stroke-width="1"/>
    <text x="285" y="17" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#7ec8e3">Physical AI</text>

    <rect x="355" y="0" width="100" height="26" rx="13" fill="#76b900" opacity="0.2" stroke="#76b900" stroke-width="1"/>
    <text x="405" y="17" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#b8e060">Agent Skills</text>

    <rect x="465" y="0" width="100" height="26" rx="13" fill="#00d4aa" opacity="0.2" stroke="#00d4aa" stroke-width="1"/>
    <text x="515" y="17" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#7ee8c6">机器人训练</text>
  </g>

  <!-- Decorative dots -->
  <g opacity="0.08">
    <circle cx="1100" cy="500" r="2" fill="#00d4aa"/>
    <circle cx="1120" cy="500" r="2" fill="#00d4aa"/>
    <circle cx="1140" cy="500" r="2" fill="#00d4aa"/>
    <circle cx="1160" cy="500" r="2" fill="#00d4aa"/>
    <circle cx="1100" cy="520" r="2" fill="#00d4aa"/>
    <circle cx="1120" cy="520" r="2" fill="#00d4aa"/>
    <circle cx="1140" cy="520" r="2" fill="#00d4aa"/>
    <circle cx="1160" cy="520" r="2" fill="#00d4aa"/>
    <circle cx="1100" cy="540" r="2" fill="#00d4aa"/>
    <circle cx="1120" cy="540" r="2" fill="#00d4aa"/>
    <circle cx="1140" cy="540" r="2" fill="#00d4aa"/>
    <circle cx="1160" cy="540" r="2" fill="#00d4aa"/>
  </g>

  <!-- Subtle radial glow behind title -->
  <ellipse cx="600" cy="300" rx="320" ry="130" fill="#00d4aa" opacity="0.03"/>
</svg>
