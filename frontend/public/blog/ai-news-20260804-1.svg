    <g transform="translate(172 -24)">
      <rect x="0" y="0" width="164" height="38" rx="19" fill="#0ea5e9" fill-opacity="0.18" stroke="#67e8f9" stroke-opacity="0.45"/>
      <text class="tag" x="82" y="25" text-anchor="middle">多模态AI</text>
    </g>
    <g transform="translate(354 -24)">
      <rect x="0" y="0" width="190" height="38" rx="19" fill="#8b5cf6" fill-opacity="0.18" stroke="#c4b5fd" stroke-opacity="0.45"/>
      <text class="tag" x="95" y="25" text-anchor="middle">PerceptionBench</text>
    </g>
    <g transform="translate(562 -24)">
      <rect x="0" y="0" width="112" height="38" rx="19" fill="#14b8a6" fill-opacity="0.16" stroke="#5eead4" stroke-opacity="0.45"/>
      <text class="tag" x="56" y="25" text-anchor="middle">OCR</text>
    </g>
    <g transform="translate(692 -24)">
      <rect x="0" y="0" width="150" height="38" rx="19" fill="#f59e0b" fill-opacity="0.14" stroke="#fcd34d" stroke-opacity="0.45"/>
      <text class="tag" x="75" y="25" text-anchor="middle">文档智能</text>
