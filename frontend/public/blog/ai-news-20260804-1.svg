<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Moonshot PerceptionBench: 多模态视觉评测封面</title>
  <desc id="desc">深色科技风 AI 技术博客封面，包含网络节点、几何线条、标题、日期和标签。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111f"/>
      <stop offset="45%" stop-color="#10264f"/>
      <stop offset="100%" stop-color="#3a155f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="22%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#3dd6ff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3dd6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="72%" r="52%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 58px; font-weight: 800; fill: #f8fbff; letter-spacing: 0; }
      .subtitle { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 25px; font-weight: 500; fill: #b8d7ff; letter-spacing: 0; }
      .meta { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 22px; font-weight: 650; fill: #e9f4ff; letter-spacing: 0; }
      .tag { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; font-weight: 650; fill: #dff7ff; letter-spacing: 0; }
      .line { stroke: #68e1fd; stroke-width: 1.6; stroke-opacity: 0.42; }
      .line2 { stroke: #b881ff; stroke-width: 1.3; stroke-opacity: 0.35; }
      .node { fill: #dff8ff; stroke: #49d5ff; stroke-width: 2; }
      .node2 { fill: #f3e8ff; stroke: #c084fc; stroke-width: 2; }
      .grid { stroke: #ffffff; stroke-opacity: 0.07; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <g opacity="0.75">
    <path class="grid" d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path class="grid" d="M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630"/>
  </g>

  <g fill="none" opacity="0.85">
    <path class="line" d="M90 135L190 88L300 142L404 82L520 135"/>
    <path class="line" d="M742 84L842 134L954 98L1086 156"/>
    <path class="line2" d="M92 480L210 414L330 458L448 398L568 452"/>
    <path class="line2" d="M690 468L812 408L930 456L1076 392"/>
    <path class="line" d="M214 230L314 286L424 238L530 306L642 246"/>
    <path class="line2" d="M678 260L780 214L882 292L1002 232"/>
  </g>

  <g filter="url(#softGlow)">
    <circle class="node" cx="90" cy="135" r="6"/><circle class="node" cx="190" cy="88" r="5"/><circle class="node" cx="300" cy="142" r="7"/><circle class="node" cx="404" cy="82" r="5"/><circle class="node" cx="520" cy="135" r="8"/>
    <circle class="node2" cx="742" cy="84" r="6"/><circle class="node2" cx="842" cy="134" r="8"/><circle class="node2" cx="954" cy="98" r="5"/><circle class="node2" cx="1086" cy="156" r="7"/>
    <circle class="node2" cx="92" cy="480" r="5"/><circle class="node2" cx="210" cy="414" r="7"/><circle class="node2" cx="330" cy="458" r="6"/><circle class="node2" cx="448" cy="398" r="8"/><circle class="node2" cx="568" cy="452" r="5"/>
    <circle class="node" cx="690" cy="468" r="6"/><circle class="node" cx="812" cy="408" r="8"/><circle class="node" cx="930" cy="456" r="6"/><circle class="node" cx="1076" cy="392" r="7"/>
  </g>

  <g opacity="0.8">
    <rect x="84" y="74" width="150" height="150" rx="18" fill="none" stroke="#49d5ff" stroke-opacity="0.25" stroke-width="2" transform="rotate(-12 159 149)"/>
    <rect x="944" y="76" width="176" height="176" rx="24" fill="none" stroke="#c084fc" stroke-opacity="0.28" stroke-width="2" transform="rotate(16 1032 164)"/>
    <path d="M104 565L184 520L258 565L184 610Z" fill="none" stroke="#49d5ff" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M1004 538L1088 492L1160 546L1078 596Z" fill="none" stroke="#c084fc" stroke-opacity="0.24" stroke-width="2"/>
  </g>

  <g transform="translate(84 236)">
    <rect x="0" y="-78" width="1032" height="248" rx="28" fill="#03101f" fill-opacity="0.34" stroke="#dbeafe" stroke-opacity="0.16"/>
    <text class="title" x="516" y="0" text-anchor="middle">Moonshot PerceptionBench</text>
    <text class="title" x="516" y="76" text-anchor="middle">重塑多模态视觉评测</text>
    <text class="subtitle" x="516" y="130" text-anchor="middle">OCR · 计数 · 定位 · 上下文推理 · 幻觉检测</text>
  </g>

  <g transform="translate(86 554)">
