<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Main gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </linearGradient>
    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.06" stroke="#6366f1" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Network nodes - left cluster -->
  <g filter="url(#softGlow)" opacity="0.3">
    <circle cx="80" cy="120" r="4" fill="#8b5cf6"/>
    <circle cx="150" cy="80" r="3" fill="#6366f1"/>
    <circle cx="120" cy="180" r="5" fill="#a78bfa"/>
    <circle cx="60" cy="250" r="3" fill="#818cf8"/>
    <circle cx="180" cy="200" r="4" fill="#c084fc"/>
    <circle cx="100" cy="300" r="3" fill="#6366f1"/>
    <circle cx="200" cy="150" r="2" fill="#8b5cf6"/>
    <circle cx="50" cy="170" r="2" fill="#a78bfa"/>
    <!-- Connection lines -->
    <line x1="80" y1="120" x2="150" y2="80" stroke="#6366f1" stroke-width="1" opacity="0.5"/>
    <line x1="80" y1="120" x2="120" y2="180" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
    <line x1="150" y1="80" x2="200" y2="150" stroke="#6366f1" stroke-width="1" opacity="0.4"/>
    <line x1="120" y1="180" x2="180" y2="200" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
    <line x1="120" y1="180" x2="60" y2="250" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
    <line x1="60" y1="250" x2="100" y2="300" stroke="#6366f1" stroke-width="1" opacity="0.4"/>
    <line x1="180" y1="200" x2="100" y2="300" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Network nodes - right cluster -->
  <g filter="url(#softGlow)" opacity="0.3">
    <circle cx="1050" cy="100" r="4" fill="#8b5cf6"/>
    <circle cx="1120" cy="150" r="3" fill="#6366f1"/>
    <circle cx="1080" cy="200" r="5" fill="#a78bfa"/>
    <circle cx="1150" cy="250" r="3" fill="#818cf8"/>
    <circle cx="1020" cy="280" r="4" fill="#c084fc"/>
    <circle cx="1100" cy="320" r="3" fill="#6366f1"/>
    <circle cx="1180" cy="180" r="2" fill="#8b5cf6"/>
    <!-- Connection lines -->
    <line x1="1050" y1="100" x2="1120" y2="150" stroke="#6366f1" stroke-width="1" opacity="0.5"/>
    <line x1="1050" y1="100" x2="1080" y2="200" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
    <line x1="1120" y1="150" x2="1180" y2="180" stroke="#6366f1" stroke-width="1" opacity="0.4"/>
    <line x1="1080" y1="200" x2="1150" y2="250" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
    <line x1="1150" y1="250" x2="1100" y2="320" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
    <line x1="1020" y1="280" x2="1100" y2="320" stroke="#6366f1" stroke-width="1" opacity="0.4"/>
    <line x1="1080" y1="200" x2="1020" y2="280" stroke="#c084fc" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Floating geometric shapes -->
  <g opacity="0.15">
    <!-- Hexagon -->
    <polygon points="950,480 970,465 990,480 990,505 970,520 950,505" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    <!-- Triangle -->
    <polygon points="100,450 130,490 70,490" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <!-- Diamond -->
    <polygon points="1100,470 1120,490 1100,510 1080,490" fill="none" stroke="#a78bfa" stroke-width="1"/>
    <!-- Circle -->
    <circle cx="200" cy="500" r="20" fill="none" stroke="#6366f1" stroke-width="1"/>
    <!-- Small squares -->
    <rect x="900" y="130" width="12" height="12" fill="none" stroke="#8b5cf6" stroke-width="1" transform="rotate(45 906 136)"/>
    <rect x="300" y="100" width="10" height="10" fill="none" stroke="#6366f1" stroke-width="1" transform="rotate(30 305 105)"/>
  </g>

  <!-- Center accent line -->
  <rect x="350" y="235" width="500" height="3" rx="1.5" fill="url(#accentGrad)" opacity="0.8"/>

  <!-- Main title -->
  <text x="600" y="290" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="bold" fill="white" filter="url(#glow)">
    Microsoft发布Agent Control Specification
  </text>
  <text x="600" y="340" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="bold" fill="white" filter="url(#glow)">
    AI Agent治理新标准正式登场
  </text>

  <!-- Subtitle -->
  <text x="600" y="385" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#a5b4fc" opacity="0.9">
    开源规范定义Agent行为边界 · 多拦截点安全防护架构 · 跨框架可移植策略文件
  </text>

  <!-- Bottom bar -->
  <rect x="0" y="560" width="1200" height="70" fill="#0a0e27" opacity="0.6"/>

  <!-- Date and author -->
  <text x="60" y="598" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#818cf8">
    2026年6月4日
  </text>
  <text x="60" y="618" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6b7280">
    by Al磊
  </text>

  <!-- Tags -->
  <g transform="translate(350, 590)">
    <rect x="0" y="0" width="90" height="26" rx="13" fill="#6366f1" opacity="0.2" stroke="#6366f1" stroke-width="1"/>
    <text x="45" y="17" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#a5b4fc">ACS</text>

    <rect x="100" y="0" width="120" height="26" rx="13" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
    <text x="160" y="17" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#c4b5fd">AI Agent</text>

    <rect x="230" y="0" width="90" height="26" rx="13" fill="#6366f1" opacity="0.2" stroke="#6366f1" stroke-width="1"/>
    <text x="275" y="17" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#a5b4fc">治理</text>

    <rect x="330" y="0" width="130" height="26" rx="13" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
    <text x="395" y="17" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#c4b5fd">LangChain</text>

    <rect x="470" y="0" width="110" height="26" rx="13" fill="#6366f1" opacity="0.2" stroke="#6366f1" stroke-width="1"/>
    <text x="525" y="17" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#a5b4fc">OpenAI SDK</text>
  </g>

  <!-- Decorative dots pattern - bottom right -->
  <g opacity="0.1">
    <circle cx="1100" cy="500" r="2" fill="#6366f1"/>
    <circle cx="1120" cy="500" r="2" fill="#6366f1"/>
    <circle cx="1140" cy="500" r="2" fill="#6366f1"/>
    <circle cx="1160" cy="500" r="2" fill="#6366f1"/>
    <circle cx="1100" cy="520" r="2" fill="#6366f1"/>
    <circle cx="1120" cy="520" r="2" fill="#6366f1"/>
    <circle cx="1140" cy="520" r="2" fill="#6366f1"/>
    <circle cx="1160" cy="520" r="2" fill="#6366f1"/>
    <circle cx="1100" cy="540" r="2" fill="#6366f1"/>
    <circle cx="1120" cy="540" r="2" fill="#6366f1"/>
    <circle cx="1140" cy="540" r="2" fill="#6366f1"/>
    <circle cx="1160" cy="540" r="2" fill="#6366f1"/>
  </g>

  <!-- Subtle radial glow behind title -->
  <ellipse cx="600" cy="300" rx="300" ry="120" fill="#6366f1" opacity="0.04"/>
</svg>