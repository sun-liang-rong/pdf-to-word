<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- 深色渐变背景 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d1b3e"/>
    </linearGradient>
    
    <!-- 科技蓝紫渐变 -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#ff006e"/>
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 节点发光 -->
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- 网格线 -->
  <g stroke="rgba(0, 212, 255, 0.08)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>
  
  <!-- 神经网络节点和连线 -->
  <!-- 左侧节点群 -->
  <g filter="url(#nodeGlow)">
    <circle cx="150" cy="180" r="8" fill="#00d4ff"/>
    <circle cx="200" cy="280" r="6" fill="#7b2ff7"/>
    <circle cx="120" cy="380" r="7" fill="#00d4ff"/>
    <circle cx="180" cy="480" r="5" fill="#ff006e"/>
  </g>
  
  <!-- 中间节点群 -->
  <g filter="url(#nodeGlow)">
    <circle cx="400" cy="150" r="10" fill="#00d4ff"/>
    <circle cx="450" cy="250" r="8" fill="#7b2ff7"/>
    <circle cx="380" cy="350" r="9" fill="#00d4ff"/>
    <circle cx="420" cy="450" r="7" fill="#ff006e"/>
    <circle cx="480" cy="520" r="6" fill="#00d4ff"/>
  </g>
  
  <!-- 右侧节点群 -->
  <g filter="url(#nodeGlow)">
    <circle cx="750" cy="120" r="9" fill="#00d4ff"/>
    <circle cx="800" cy="220" r="11" fill="#7b2ff7"/>
    <circle cx="720" cy="320" r="8" fill="#00d4ff"/>
    <circle cx="850" cy="420" r="10" fill="#ff006e"/>
    <circle cx="780" cy="500" r="7" fill="#00d4ff"/>
  </g>
  
  <!-- 连线 -->
  <g stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6">
    <line x1="150" y1="180" x2="400" y2="150"/>
    <line x1="200" y1="280" x2="450" y2="250"/>
    <line x1="120" y1="380" x2="380" y2="350"/>
    <line x1="180" y1="480" x2="420" y2="450"/>
    <line x1="400" y1="150" x2="750" y2="120"/>
    <line x1="450" y1="250" x2="800" y2="220"/>
    <line x1="380" y1="350" x2="720" y2="320"/>
    <line x1="420" y1="450" x2="850" y2="420"/>
    <line x1="480" y1="520" x2="780" y2="500"/>
    <!-- 交叉连线 -->
    <line x1="400" y1="150" x2="800" y2="220" opacity="0.3"/>
    <line x1="450" y1="250" x2="750" y2="120" opacity="0.3"/>
  </g>
  
  <!-- 几何装饰 - 六边形 -->
  <g stroke="url(#accentGradient)" stroke-width="1" fill="none" opacity="0.4">
    <polygon points="1050,80 1080,100 1080,140 1050,160 1020,140 1020,100"/>
    <polygon points="1120,200 1150,220 1150,260 1120,280 1090,260 1090,220"/>
    <polygon points="1080,350 1110,370 1110,410 1080,430 1050,410 1050,370"/>
  </g>
  
  <!-- 三角形装饰 -->
  <g fill="url(#accentGradient)" opacity="0.3">
    <polygon points="80,550 120,520 140,570"/>
    <polygon points="1050,520 1080,490 1110,540"/>
  </g>
  
  <!-- 数据点装饰 -->
  <g fill="#00d4ff" opacity="0.5">
    <circle cx="900" cy="180" r="3"/>
    <circle cx="950" cy="280" r="2"/>
    <circle cx="1000" cy="150" r="4"/>
    <circle cx="880" cy="350" r="2"/>
    <circle cx="920" cy="450" r="3"/>
  </g>
  
  <!-- 主标题 -->
  <text x="600" y="310" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" filter="url(#glow)">
    Anthropic Colossus2
  </text>
  <text x="600" y="365" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#accentGradient)" filter="url(#glow)">
    + NVIDIA GB200 算力革命
  </text>
  
  <!-- 副标题装饰线 -->
  <line x1="350" y1="400" x2="850" y2="400" stroke="url(#accentGradient)" stroke-width="3"/>
  
  <!-- 底部信息 -->
  <text x="600" y="570" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.7)">
    AI基础设施深度解析 | 2026.05.22
  </text>
  
  <!-- 底部标签 -->
  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#00d4ff">
    <rect x="420" y="585" width="100" height="28" rx="14" fill="rgba(0,212,255,0.15)" stroke="#00d4ff" stroke-width="1"/>
    <text x="470" y="604" text-anchor="middle">AI基础设施</text>
    
    <rect x="540" y="585" width="100" height="28" rx="14" fill="rgba(123,47,247,0.15)" stroke="#7b2ff7" stroke-width="1"/>
    <text x="590" y="604" text-anchor="middle">NVIDIA GB200</text>
    
    <rect x="660" y="585" width="100" height="28" rx="14" fill="rgba(255,0,110,0.15)" stroke="#ff006e" stroke-width="1"/>
    <text x="710" y="604" text-anchor="middle">大模型训练</text>
  </g>
</svg>