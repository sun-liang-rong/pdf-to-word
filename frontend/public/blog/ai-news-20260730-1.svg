<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agents-A1与文档智能体封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="45%" stop-color="#10215a"/>
      <stop offset="100%" stop-color="#3b1163"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#5ee7ff" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <style>
      .title{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','Microsoft YaHei',Arial,sans-serif;font-size:58px;font-weight:800;fill:#fff;letter-spacing:1px}
      .sub{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','Microsoft YaHei',Arial,sans-serif;font-size:24px;font-weight:600;fill:#b8e8ff}
      .meta{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','Microsoft YaHei',Arial,sans-serif;font-size:22px;font-weight:600;fill:#d7dcff}
      .tag{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','Microsoft YaHei',Arial,sans-serif;font-size:18px;font-weight:700;fill:#ffffff}
      .line{stroke:#7dd3fc;stroke-width:2;opacity:.35}
      .node{fill:#67e8f9;opacity:.9}
      .panel{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.16);stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="180" cy="100" r="110" fill="#22d3ee" opacity=".16" filter="url(#blur)"/>
  <circle cx="1010" cy="500" r="150" fill="#a855f7" opacity=".20" filter="url(#blur)"/>
  <path d="M0 500 C220 430 335 560 520 475 S840 350 1200 430" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".22"/>
  <path d="M0 130 C160 195 260 70 420 150 S760 255 1200 100" fill="none" stroke="#c084fc" stroke-width="2" opacity=".20"/>

  <!-- network decoration -->
  <g>
    <line class="line" x1="95" y1="250" x2="180" y2="190"/><line class="line" x1="180" y1="190" x2="270" y2="235"/><line class="line" x1="270" y1="235" x2="335" y2="150"/>
    <line class="line" x1="870" y1="160" x2="960" y2="105"/><line class="line" x1="960" y1="105" x2="1060" y2="170"/><line class="line" x1="1060" y1="170" x2="1115" y2="90"/>
    <line class="line" x1="820" y1="455" x2="930" y2="410"/><line class="line" x1="930" y1="410" x2="1040" y2="455"/><line class="line" x1="1040" y1="455" x2="1110" y2="380"/>
    <circle class="node" cx="95" cy="250" r="7"/><circle class="node" cx="180" cy="190" r="9"/><circle class="node" cx="270" cy="235" r="7"/><circle class="node" cx="335" cy="150" r="8"/>
    <circle class="node" cx="870" cy="160" r="7"/><circle class="node" cx="960" cy="105" r="9"/><circle class="node" cx="1060" cy="170" r="7"/><circle class="node" cx="1115" cy="90" r="8"/>
    <circle class="node" cx="820" cy="455" r="7"/><circle class="node" cx="930" cy="410" r="9"/><circle class="node" cx="1040" cy="455" r="7"/><circle class="node" cx="1110" cy="380" r="8"/>
  </g>

  <!-- geometric panels -->
  <g opacity=".95">
    <rect class="panel" x="120" y="420" width="155" height="82" rx="18" transform="rotate(-8 120 420)"/>
    <rect class="panel" x="920" y="230" width="180" height="92" rx="20" transform="rotate(10 920 230)"/>
    <path d="M560 82 L625 120 L625 195 L560 233 L495 195 L495 120 Z" fill="rgba(94,234,212,.07)" stroke="rgba(94,234,212,.32)" stroke-width="2"/>
  </g>

  <g text-anchor="middle">
    <text class="sub" x="600" y="165">AI Agent · Reinforcement Learning · PDF Automation</text>
    <text class="title" x="600" y="275">Agents-A1与文档智能体</text>
    <text class="title" x="600" y="350">强化学习如何提升PDF自动化</text>
  </g>

  <g transform="translate(120,535)">
    <text class="meta" x="0" y="0">2026-07-30</text>
    <g transform="translate(180,-25)">
      <rect x="0" y="0" width="108" height="34" rx="17" fill="#2563eb" opacity=".85"/><text class="tag" x="54" y="23" text-anchor="middle">Agents-A1</text>
      <rect x="124" y="0" width="92" height="34" rx="17" fill="#7c3aed" opacity=".85"/><text class="tag" x="170" y="23" text-anchor="middle">RLHF</text>
      <rect x="232" y="0" width="118" height="34" rx="17" fill="#0891b2" opacity=".85"/><text class="tag" x="291" y="23" text-anchor="middle">工具调用</text>
      <rect x="366" y="0" width="142" height="34" rx="17" fill="#0f766e" opacity=".85"/><text class="tag" x="437" y="23" text-anchor="middle">PDF文档AI</text>
    </g>
  </g>
</svg>
