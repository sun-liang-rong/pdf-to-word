<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00dbde;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fc00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Network nodes and lines -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="1">
    <!-- Lines connecting nodes -->
    <line x1="100" y1="100" x2="300" y2="150"/>
    <line x1="300" y1="150" x2="500" y2="80"/>
    <line x1="500" y1="80" x2="700" y2="120"/>
    <line x1="700" y1="120" x2="900" y2="70"/>
    <line x1="900" y1="70" x2="1100" y2="100"/>
    
    <line x1="150" y1="300" x2="350" y2="350"/>
    <line x1="350" y1="350" x2="550" y2="280"/>
    <line x1="550" y1="280" x2="750" y2="320"/>
    <line x1="750" y1="320" x2="950" y2="270"/>
    <line x1="950" y1="270" x2="1100" y2="300"/>
    
    <line x1="200" y1="500" x2="400" y2="520"/>
    <line x1="400" y1="520" x2="600" y2="480"/>
    <line x1="600" y1="480" x2="800" y2="510"/>
    <line x1="800" y1="510" x2="1000" y2="470"/>
    
    <!-- Cross connections -->
    <line x1="300" y1="150" x2="350" y2="350"/>
    <line x1="500" y1="80" x2="550" y2="280"/>
    <line x1="700" y1="120" x2="750" y2="320"/>
    <line x1="900" y1="70" x2="950" y2="270"/>
    
    <line x1="350" y1="350" x2="400" y2="520"/>
    <line x1="550" y1="280" x2="600" y2="480"/>
    <line x1="750" y1="320" x2="800" y2="510"/>
    <line x1="950" y1="270" x2="1000" y2="470"/>
  </g>
  
  <!-- Nodes -->
  <g fill="url(#accentGrad)" filter="url(#glow)">
    <circle cx="100" cy="100" r="4"/>
    <circle cx="300" cy="150" r="6"/>
    <circle cx="500" cy="80" r="5"/>
    <circle cx="700" cy="120" r="7"/>
    <circle cx="900" cy="70" r="4"/>
    <circle cx="1100" cy="100" r="6"/>
    
    <circle cx="150" cy="300" r="5"/>
    <circle cx="350" cy="350" r="8"/>
    <circle cx="550" cy="280" r="6"/>
    <circle cx="750" cy="320" r="5"/>
    <circle cx="950" cy="270" r="7"/>
    <circle cx="1100" cy="300" r="4"/>
    
    <circle cx="200" cy="500" r="4"/>
    <circle cx="400" cy="520" r="6"/>
    <circle cx="600" cy="480" r="5"/>
    <circle cx="800" cy="510" r="8"/>
    <circle cx="1000" cy="470" r="6"/>
  </g>
  
  <!-- Geometric shapes -->
  <polygon points="600,180 650,220 620,270 580,270 550,220" fill="none" stroke="rgba(0,219,222,0.3)" stroke-width="2"/>
  <polygon points="300,400 330,420 315,450 285,450 270,420" fill="none" stroke="rgba(252,0,255,0.3)" stroke-width="2"/>
  <polygon points="900,400 930,420 915,450 885,450 870,420" fill="none" stroke="rgba(0,219,222,0.3)" stroke-width="2"/>
  
  <!-- Main title -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white" filter="url(#glow)">
    AI Agent自主进化：多智能体系统
  </text>
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white" filter="url(#glow)">
    革新文档处理自动化
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="rgba(255,255,255,0.8)">
    2026年多智能体协作技术深度解析
  </text>
  
  <!-- Bottom info -->
  <rect x="0" y="580" width="1200" height="50" fill="rgba(0,0,0,0.3)"/>
  <text x="100" y="610" font-family="Arial, sans-serif" font-size="18" fill="white">
    2026-05-30 | AI技术博客
  </text>
  <text x="1100" y="610" font-family="Arial, sans-serif" font-size="16" text-anchor="end" fill="rgba(255,255,255,0.7)">
    #AI #多智能体 #文档处理 #自动化
  </text>
</svg>